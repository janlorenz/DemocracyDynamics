name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Fails if generated stubs are missing or out of date (run `Rscript scripts/mirror.R --write` locally).
      - name: Check translation stubs
        run: Rscript scripts/mirror.R --check

      - uses: quarto-dev/quarto-actions/setup@v2

      # Code cells are not executed here: results come from the committed _freeze/ folder.
      # Render locally (`quarto render`) and commit _freeze/ after changing code pages.
      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
