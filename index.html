<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Democracy Dynamics</title>
  <!-- Relative targets keep this working on GitHub project pages and other hosts. -->
  <noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
  <script>
    var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
    location.replace(lang === "de" ? "de/" : "en/");
  </script>
</head>
<body>
  <p><a href="en/">English</a> | <a href="de/">Deutsch</a></p>
</body>
</html>
